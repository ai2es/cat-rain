base_data_path: "/glade/derecho/scratch/cbecker/CAT_daily/chunked_data/"
data_prefix: "veraset"
key_file: "/glade/derecho/scratch/cbecker/CAT_daily/chunked_data/id_row_group_key.parquet"
home_loc_file: '/glade/derecho/scratch/ggantos/CAT/home_locations_tao_filtered/home_loc_by_row_group.parquet'
geo_file: "/glade/work/cbecker/california_zip.geojson"
save_out_path: ""
start_date: "2024-03-15"
end_date: "2024-04-25"
days_of_week: "all" # Supports: "MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN" amd "all"
row_group_start_end: [] # empty [] will use all row groups [start, end]
aggregation_type: "daily" # Supports "full" or "daily"; only applies to non_grouped_calcs
n_workers: -1 # -1 to use all available CPU workers
pipeline: ["mobility_filter", "get_max_distance_from_home", "number_of_visits", "distance_straight_line", "jump_lengths", "waiting_times", "radius_of_gyration"]
grouped_analysis:
  use: False # ignores "grouped" calculations if False
  spatial_agg: ["zipcode"]
  temporal_agg: ["date"] # Currently only supports "date"
  stats: ["mean", "median", "sum"]

########### FILTERING ##########
filters:
  mobility_filter:
    max_speed_kmh: 200.0
    include_loops: False
    speed_kmh: 5.0
    max_loop: 6
    ratio_max: 0.25

  compress:
    spatial_radius_km: 0.2

  custom_filter:
    horizontal_acc: 10
    id_type: 'idfa'

########### INDIVIDUAL MEASURES ##########
individual_measures:
  radius_of_gyration:
    show_progress: False

  jump_lengths:
    show_progress: False
    merge: False

  real_entropy:
    show_progress: False

  uncorrelated_entropy:
    normalize: False
    show_progress: False

  distance_straight_line:
    show_progress: False

  number_of_visits:
    show_progress: False

  waiting_times:
    show_progress: False

  get_max_distance_from_home:
    kwargs: None

##################### COLLECTIVE METRICS ###############

collective_measures:
  mean_square_displacement:
    days: 0
    hours: 1
    minutes: 0
    show_progress: False

  random_location_entropy:
    show_progress: False

  uncorrelated_location_entropy:
    normalize: False
    show_progress: False








