base_data_path: ""
data_prefix: ""
key_file: ""
save_out_path: ""
start_date: "2024-03-14"
end_date: "2024-04-30"
days_of_week: "all" # Supports: "MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN" amd "all"
row_group_start_end: [] # empty [] will use all row groups [start, end]
aggregation_type: "full" # Supports "full" or "daily"
n_workers: -1 # -1 to use all available CPU workers

# (List) Should be keys under the "filters" or "measures"
# Will operate sequentially in the defined order
# Example: ["compress", "home_location", "max_distance_from_home"]
# Would result in compressing all the data with given args, then calculating the home loc and max distance
# and merging the results. Filters apply one after another on the output of the previous filter result
# Measures are calculated independently on the filter results (if any) and then merged together
pipeline: ["mobility_filter", "compress", "radius_of_gyration", "jump_lengths", "home_location", "max_distance_from_home"]

filters:
########### FILTERING ##########
  mobility_filter:
    max_speed_kmh: 500.0
    include_loops: False
    speed_kmh: 5.0
    max_loop: 6
    ratio_max: 0.25

  compress:
    spatial_radius_km: 0.2

########### INDIVIDUAL MEASURES ##########
individual_measures:
  radius_of_gyration:
    show_progress: False

  home_location:
    start_night: '22:00'
    end_night: '07:00'
    show_progress: False

  jump_lengths:
    show_progress: False
    merge: False

  max_distance_from_home:
    start_night: '22:00'
    end_night: '07:00'
    show_progress: False

  real_entropy:
    show_progress: False

  uncorrelated_entropy:
    normalize: False
    show_progress: False

#####################  COLLECTIVE MEASURES ###############
collective_measures:
  mean_square_displacement:
    days: 0
    hours: 1
    minutes: 0
    show_progress: False

  random_location_entropy:
    show_progress: False

  uncorrelated_location_entropy:
    normalize: False
    show_progress: False




