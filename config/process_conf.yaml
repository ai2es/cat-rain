#base_data_path: ""
#data_prefix: ""
#key_file: ""
#save_out_path: ""
base_data_path: "/glade/derecho/scratch/cbecker/CAT_daily/chunked_data/"
data_prefix: "veraset"
key_file: "/glade/derecho/scratch/cbecker/CAT_daily/chunked_data/id_row_group_key.parquet"
home_loc_file: '/glade/derecho/scratch/cbecker/CAT/home_locations/home_loc_by_row_group.parquet'
geo_file: "/glade/work/cbecker/california_zip.geojson"
save_out_path: "/glade/derecho/scratch/cbecker/CAT_analysis_data/"
start_date: "2024-03-15"
end_date: "2024-04-30"
days_of_week: "all" # Supports: "MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN" amd "all"
row_group_start_end: [] # empty [] will use all row groups [start, end]
aggregation_type: "daily" # Supports "full" or "daily"; only applies to non_grouped_calcs
n_workers: -1 # -1 to use all available CPU workers

# (List) Should be keys under the "filters" or "measures"
# Will operate sequentially in the defined order
# Example: ["compress", "uncorrelated_entropy", "radius_of_gyration"]
# Would result in compressing all the data with given args, then calculating the entropy and ROG
# and merging the results. Filters apply one after another on the output of the previous filter result
# Measures are calculated independently on the filter results (if any) and then merged together
pipeline: ["uncorrelated_entropy", "radius_of_gyration", "distance_straight_line","get_stop_counts", "get_daily_distance", "get_daily_stops"]

# The previous pipeline results in a metrics for each individual and includes their home location
# Below in "grouped_analysis", if use==True, it will perform spatial and temporal aggregation and apply list stats
grouped_analysis:
  use: True # ignores "grouped" calculations if False
  spatial_agg: ["zipcode"]
  temporal_agg: ["date"] # Currently only supports "date"
  stats: ["mean", "median", "sum"]

########### FILTERING ##########
filters:
  mobility_filter:
    max_speed_kmh: 500.0
    include_loops: False
    speed_kmh: 5.0
    max_loop: 6
    ratio_max: 0.25

  compress:
    spatial_radius_km: 0.2

  custom_filter:
    min_time: None
    max_time: None
    max_horizontal_acc: None
    cell_type: None

########### INDIVIDUAL MEASURES ##########
individual_measures:
  radius_of_gyration:
    show_progress: False

  jump_lengths:
    show_progress: False
    merge: False

  real_entropy:
    show_progress: False

  uncorrelated_entropy:
    normalize: False
    show_progress: False

  distance_straight_line:
    show_progress: False

  get_stop_counts:
    stop_radius_factor: 0.5
    minutes_for_a_stop: 20.0
    spatial_radius_km: 0.2
    leaving_time: True

  get_daily_distance: {}

  get_daily_stops:
    stop_radius_factor: 0.5
    minutes_for_a_stop: 20.0
    spatial_radius_km: 0.2
    leaving_time: True

##################### COLLECTIVE METRICS ###############

collective_measures:
  mean_square_displacement:
    days: 0
    hours: 1
    minutes: 0
    show_progress: False

  random_location_entropy:
    show_progress: False

  uncorrelated_location_entropy:
    normalize: False
    show_progress: False

############ GROUPED ANALYSIS SETTINGS ############
grouped_analysis:
  use: True
  spatial_agg: ["zipcode"]
  temporal_agg: ["date"]
  stats: ["mean", "median", "sum"]







